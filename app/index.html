<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFBF8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Đặt sáng/tối trước khi vẽ lần đầu để không nháy. Cùng luật với src/theme.ts.
      (function () {
        try {
          var m = localStorage.getItem('sh-theme');
          var dark = m === 'dark' || (m !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#121116');
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sweet Home" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/BeVietnamPro-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/BeVietnamPro-Light.woff" as="font" type="font/woff" crossorigin />
    <meta property="og:title" content="Sweet Home" />
    <meta property="og:description" content="Ngôi nhà nhỏ của cả nhà, dù ở xa. Vào nhà cùng mình nhé." />
    <meta property="og:image" content="https://homeletter-production.up.railway.app/icon-512.png" />
    <meta property="og:type" content="website" />
    <title>Sweet Home</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
