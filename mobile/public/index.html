<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#000000" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #000;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- Màn hình chờ hiện ngay khi mở link, trong lúc tải app. App tự gỡ nó khi đã sẵn sàng (src/app/_layout.tsx). -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 10; background: #000; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px; transition: opacity .25s ease;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #fff;
      }
      #boot b { font-size: 30px; font-weight: 600; letter-spacing: -1px; }
      #boot span { font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #A1A1AA; }
      #boot i { width: 120px; height: 3px; border-radius: 2px; background: #222226; overflow: hidden; position: relative; }
      #boot i::after {
        content: ''; position: absolute; inset: 0; width: 40%; background: linear-gradient(90deg, #8F20B3, #E0306E, #F28A3C); border-radius: 2px;
        animation: boot 1.1s ease-in-out infinite;
      }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot i::after { animation: none; width: 100%; } }
    </style>
  </head>

  <body>
    <noscript>Cần bật JavaScript để dùng Homeletter.</noscript>
    <div id="boot" role="status" aria-label="Đang mở Homeletter">
      <svg width="76" height="76" viewBox="0 0 1024 1024" aria-hidden="true" style="background:#fff;border-radius:50%;padding:14px;box-sizing:border-box">
        <path d="M512 236 L806 492 L726 492 L726 768 L298 768 L298 492 L218 492 Z" fill="#C8321F" stroke="#C8321F" stroke-width="56" stroke-linejoin="round"/>
        <path d="M330 516 L512 640 L694 516" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
        <g transform="translate(426 570) scale(1.72)"><path d="M50 88 C22 68 6 52 6 33 C6 18 17 8 30 8 C39 8 46 13 50 21 C54 13 61 8 70 8 C83 8 94 18 94 33 C94 52 78 68 50 88 Z" fill="#A3261A" stroke="#C8321F" stroke-width="8"/></g>
      </svg>
      <b>Homeletter</b>
      <span>Đang mở thư nhà…</span>
      <i></i>
    </div>
    <div id="root"></div>
  </body>
</html>
